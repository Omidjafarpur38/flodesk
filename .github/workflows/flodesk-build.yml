name: flodesk-build
on:
  push: { branches: [flodesk], tags: ['v*'] }
  workflow_dispatch:
env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  NDK_VERSION: "r28c"
  CARGO_NDK_VERSION: "3.1.2"
  FLODESK_VERSION: "1.1.0"
  RENDEZVOUS: ${{ vars.FLODESK_SERVER || 'rd.asandesk.ir' }}
  RS_KEY: ${{ vars.FLODESK_PUBKEY || 'joRoqzc0SDOHe61V9WrRORk4PqBVzBntfGtzveM3h8M=' }}
permissions: { contents: write }
jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  windows:
    needs: [generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with: { name: bridge-artifact, path: ./ }
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with: { version: "${{ env.LLVM_VERSION }}" }
      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/* C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/
      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with: { prefix-key: flodesk-windows }
      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Install vcpkg dependencies
        env: { VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static }
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed" --overlay-ports="$GITHUB_WORKSPACE/flodesk/vcpkg-overlay"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do echo "$f:"; cat "$f"; done
            exit 1
          fi
      - name: Install ImageMagick
        shell: pwsh
        run: |
          choco install -y imagemagick --no-progress
          $d = Get-ChildItem 'C:\Program Files\ImageMagick-*' -Directory | Select-Object -First 1
          if ($d) { $d.FullName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH }
      - name: Verify ImageMagick + logo
        shell: bash
        run: |
          ls -l flodesk/logo.png
          magick --version | head -1
      - name: Rebrand
        shell: bash
        run: bash flodesk/rebrand.sh . flodesk/logo.png "$RENDEZVOUS" "$RS_KEY"
      - name: Build
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./FloDesk-win
          if (Test-Path ./FloDesk-win/rustdesk.exe) { mv ./FloDesk-win/rustdesk.exe ./FloDesk-win/FloDesk.exe }
          Compress-Archive -Path ./FloDesk-win -DestinationPath FloDesk-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: FloDesk-windows-x64.zip }
      - name: Single-file exe (portable packer)
        continue-on-error: true
        shell: bash
        run: |
          cd libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../FloDesk-win -o . -e ../../FloDesk-win/FloDesk.exe
          cd ../..
          cp target/release/rustdesk-portable-packer.exe FloDesk.exe
          cp FloDesk.exe "FloDesk-${FLODESK_VERSION}.exe"
          ls -l FloDesk.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            FloDesk.exe
            FloDesk-*.exe
          if-no-files-found: warn

  android:
    needs: [generate-bridge]
    runs-on: ubuntu-22.04
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc-multilib git g++ g++-multilib libclang-dev llvm-dev nasm ninja-build openjdk-17-jdk-headless pkg-config wget imagemagick
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with: { name: bridge-artifact, path: ./ }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { channel: stable, flutter-version: "${{ env.FLUTTER_VERSION }}" }
      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with: { ndk-version: "${{ env.NDK_VERSION }}", add-to-path: true }
      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Install vcpkg dependencies (arm64-v8a + armeabi-v7a)
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            if ! ./flutter/build_android_deps.sh "$abi"; then
              find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do echo "$f:"; cat "$f"; done
              exit 1
            fi
          done
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with: { toolchain: "${{ env.RUST_VERSION }}", components: rustfmt }
      - uses: Swatinem/rust-cache@v2
        with: { prefix-key: flodesk-android, key: android-arm64-armv7 }
      - name: Verify ImageMagick + logo
        shell: bash
        run: |
          ls -l flodesk/logo.png
          convert --version | head -1
      - name: Rebrand
        shell: bash
        run: bash flodesk/rebrand.sh . flodesk/logo.png "$RENDEZVOUS" "$RS_KEY"
      - name: Build rustdesk lib
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm64.sh
          ./flutter/ndk_arm.sh
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a ./flutter/android/app/src/main/jniLibs/armeabi-v7a
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/
          cp ./target/armv7-linux-androideabi/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
      - name: Build apk (universal arm64-v8a + armeabi-v7a)
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          KS_B64: ${{ secrets.FLODESK_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.FLODESK_KEYSTORE_PASSWORD }}
        run: |
          set -e
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "SIGNING=release" >> "$GITHUB_ENV"
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/flodesk-release.p12"
            cat > flutter/android/key.properties <<KP
          storePassword=$KS_PASS
          keyPassword=$KS_PASS
          keyAlias=flodesk
          storeFile=$RUNNER_TEMP/flodesk-release.p12
          KP
            # key.properties lines must start at column 0
            sed -i 's/^ *//' flutter/android/key.properties
            grep -q "storePassword keystoreProperties" flutter/android/app/build.gradle
            sed -i "s/^\( *\)storePassword keystoreProperties\['storePassword'\]/&\n\1storeType 'pkcs12'/" flutter/android/app/build.gradle
            grep -q "storeType 'pkcs12'" flutter/android/app/build.gradle
          else
            echo "::warning::FLODESK_KEYSTORE_B64/PASSWORD secrets missing -> DEBUG-signed APK (not for distribution)"
            echo "SIGNING=debug" >> "$GITHUB_ENV"
            sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          fi
          cd flutter
          flutter build apk --release --target-platform android-arm,android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk ../FloDesk.apk
          cp ../FloDesk.apk "../FloDesk-${FLODESK_VERSION}.apk"
      - name: Verify apk (apksigner, aapt, ABIs)
        shell: bash
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          {
            echo "== apksigner verify =="
            "$BT/apksigner" verify --verbose --print-certs FloDesk.apk
            echo "== aapt badging =="
            "$BT/aapt" dump badging FloDesk.apk | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|application-label:|uses-permission)" 
            echo "== native libs =="
            unzip -l FloDesk.apk | grep -E "lib/(arm64-v8a|armeabi-v7a)/" 
            echo "== sha256 =="
            sha256sum FloDesk.apk
          } 2>&1 | tee apk-verify.log
          "$BT/apksigner" verify --verbose FloDesk.apk 2>&1 | grep -E "v1 scheme.*true|v2 scheme.*true|v3 scheme.*true" | wc -l | grep -q 3
          "$BT/aapt" dump badging FloDesk.apk | grep -q "native-code: 'arm64-v8a' 'armeabi-v7a'\|native-code: 'armeabi-v7a' 'arm64-v8a'"
          "$BT/aapt" dump badging FloDesk.apk | grep -q "package: name='top.poshakerp.flodesk'"
          if [ "$SIGNING" = release ]; then
            ! "$BT/apksigner" verify --print-certs FloDesk.apk | grep -qi "Android Debug"
          fi
          cp apk-verify.log "FloDesk-verify-${FLODESK_VERSION}.log"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            FloDesk.apk
            FloDesk-*.apk
            FloDesk-verify-*.log

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*" }
